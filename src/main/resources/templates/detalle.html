<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Detalle de materia</title><link rel="stylesheet" th:href="@{/css/estilos.css}"></head>
<body><header class="top"><div class="wrap topinner"><a class="brand" th:href="@{/materias}">LRCP <span class="tag">· Actividad 3</span></a></div></header><main class="wrap" style="max-width:850px"><section class="hero"><a th:href="@{/materias}">← Volver al catálogo</a></section><section class="card"><div class="tag">@ManyToOne · FK categoria_id</div><h1 th:text="${materia.nombre}">Programacion web</h1><div class="kv"><strong>ID</strong><span th:text="${materia.id}">1</span></div><div class="kv"><strong>Categoría relacionada</strong><span><span class="pill" th:text="${materia.categoriaNombre}">Programacion</span> <span class="help" th:text="'ID: ' + ${materia.categoriaId}">ID:1</span></span></div><div class="kv"><strong>Semestre</strong><span th:text="${materia.semestre}">7</span></div><div class="kv"><strong>Descripción</strong><span th:text="${materia.descripcion}">Texto</span></div><div class="actions" style="margin-top:25px"><a class="btn" th:href="@{/materias/{id}/editar(id=${materia.id})}">Editar</a><a class="btn secondary" th:href="@{/materias}">Regresar</a></div></section></main><footer class="foot" th:text="${nombreAplicacion}"></footer></body></html>
