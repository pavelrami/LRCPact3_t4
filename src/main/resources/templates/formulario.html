<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registrar / editar materia</title><link rel="stylesheet" th:href="@{/css/estilos.css}"></head>
<body><header class="top"><div class="wrap topinner"><a class="brand" th:href="@{/materias}">LRCP <span class="tag">· Actividad 3</span></a><nav><a th:href="@{/materias}">Catálogo</a></nav></div></header>
<main class="wrap" style="max-width:850px"><section class="hero"><a th:href="@{/materias}">← Volver al catálogo</a></section><section class="card"><div class="tag">Thymeleaf · @ModelAttribute · JPA</div><h1 th:text="${modoEditar} ? 'Editar materia' : 'Registrar nueva materia'">Registrar materia</h1><p class="muted">Los cambios se guardan en MySQL y permanecen después de reiniciar el servidor.</p><div th:if="${error}" class="notice error" th:text="${error}"></div><form th:action="@{/materias/guardar}" th:object="${materia}" method="post"><input type="hidden" th:field="*{id}"><div class="field"><label for="nombre">Nombre de la materia *</label><input id="nombre" th:field="*{nombre}" maxlength="140" placeholder="Ej. Bases de datos" required></div><div class="formgrid"><div class="field"><label for="categoriaId">Categoría *</label><select id="categoriaId" th:field="*{categoriaId}" required><option value="">Selecciona una categoría</option><option th:each="cat : ${categorias}" th:value="${cat.id}" th:text="${cat.nombre}"></option></select></div><div class="field"><label for="semestre">Semestre *</label><input id="semestre" type="number" min="1" max="12" th:field="*{semestre}" required></div></div><div class="field"><label for="descripcion">Descripción</label><textarea id="descripcion" maxlength="500" th:field="*{descripcion}" placeholder="Describe brevemente la materia"></textarea></div><div class="actions" style="justify-content:end"><a class="btn secondary" th:href="@{/materias}">Cancelar</a><button type="submit" class="btn" th:text="${modoEditar} ? 'Guardar cambios' : 'Crear materia'">Guardar</button></div></form></section></main><footer class="foot" th:text="${nombreAplicacion}"></footer></body></html>
